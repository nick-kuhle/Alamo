name: Build and publish Kodi repository

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build deps
        run: pip install requests pillow

      - name: Run tests
        run: python3 tests/test_smoke.py

      - name: Verify skin XML parses
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          for f in glob.glob('plugin.video.alamo/resources/skins/Default/1080i/*.xml'):
              ET.parse(f)
              print('ok', f)
          PY

      - name: Build repository
        run: python3 tools/build_repo.py

      - name: Publish dist/ to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          enable_jekyll: false

      - name: Attach zips to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/plugin.video.alamo/*.zip
            dist/repository.alamo/*.zip
            dist/script.alamo.provider.example/*.zip
