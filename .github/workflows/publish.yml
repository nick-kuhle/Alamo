name: Build and publish Kodi repository

# Every push to main republishes gh-pages, so the source tree, the zips and
# addons.xml can never drift apart. Tags additionally cut a GitHub Release.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build deps
        run: pip install requests pillow

      - name: Run tests
        run: python3 tests/test_smoke.py

      - name: Verify skin XML parses
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          for f in glob.glob('plugin.video.alamo/resources/skins/Default/1080i/*.xml'):
              ET.parse(f)
              print('ok', f)
          PY

      - name: Check the version was bumped
        # A published zip must never change content under a version already
        # released, or Kodi will keep serving its cached copy.
        run: |
          python3 - <<'PY'
          import urllib.request, xml.etree.ElementTree as ET, sys
          local = ET.parse('plugin.video.alamo/addon.xml').getroot().get('version')
          try:
              live_xml = urllib.request.urlopen(
                  'https://nick-kuhle.github.io/Alamo/addons.xml', timeout=30).read()
          except Exception as exc:
              print('no live repo yet (%s) - continuing' % exc); sys.exit(0)
          live = {a.get('id'): a.get('version') for a in ET.fromstring(live_xml)}
          published = live.get('plugin.video.alamo')
          print('local %s / published %s' % (local, published))
          if published and published == local:
              print('::warning::version %s is already published - bump '
                    'plugin.video.alamo/addon.xml or Kodi will not see an update'
                    % local)
          PY

      - name: Build repository
        run: python3 tools/build_repo.py

      - name: Publish dist/ to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          enable_jekyll: false

      - name: Attach zips to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/plugin.video.alamo/*.zip
            dist/repository.alamo/*.zip
            dist/script.alamo.provider.example/*.zip

      - name: Verify the published repository
        run: |
          sleep 45
          python3 - <<'PY'
          import time, urllib.request, xml.etree.ElementTree as ET
          base = 'https://nick-kuhle.github.io/Alamo/'
          want = ET.parse('plugin.video.alamo/addon.xml').getroot().get('version')
          for attempt in range(10):
              try:
                  xml = urllib.request.urlopen(base + 'addons.xml', timeout=30).read()
                  live = {a.get('id'): a.get('version') for a in ET.fromstring(xml)}
                  if live.get('plugin.video.alamo') == want:
                      for path in ('plugin.video.alamo/plugin.video.alamo-%s.zip' % want,
                                   'repository.alamo/repository.alamo-%s.zip' % want,
                                   'addons.xml.md5', ''):
                          code = urllib.request.urlopen(base + path, timeout=30).getcode()
                          print(code, base + path)
                      print('published %s' % want)
                      raise SystemExit(0)
                  print('attempt %d: live=%s want=%s' % (attempt, live.get('plugin.video.alamo'), want))
              except SystemExit:
                  raise
              except Exception as exc:
                  print('attempt %d: %s' % (attempt, exc))
              time.sleep(20)
          raise SystemExit('published repository never caught up')
          PY
